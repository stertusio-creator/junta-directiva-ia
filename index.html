<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Junta Directiva — Informe de productividad</title>
<style>
:root{--bg:#f4f1ea;--ink:#1c1917;--muted:#57534e;--paper:#fffcf6;--line:#d6d3d1;--mark:#1e3a5f;--mark-bg:#e8eef6;--danger:#9f1239;--accent:#1e3a5f;}
*{box-sizing:border-box}
body{margin:0;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;background:var(--bg);color:var(--ink);line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:1.6rem;margin:0 0 8px;font-weight:600}
h2{font-size:1.25rem;margin:0 0 12px;font-weight:600}
.eyebrow{font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--paper);border:1px solid var(--line);padding:22px}
.muted{color:var(--muted)}
p{margin:0 0 12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
button{font-family:system-ui,sans-serif;font-size:.92rem;padding:10px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);margin-bottom:8px;font-size:.9rem;line-height:1.4}
button.opt.picked{outline:2px solid var(--accent);background:var(--mark-bg)}
.phrase{cursor:pointer;background:#ede8dc;border-bottom:1px dotted var(--accent);padding:0 2px}
.phrase.on{background:var(--mark-bg);color:var(--mark)}
.status{font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin-top:8px}
.clock{font-family:system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:1.4rem;color:var(--danger);margin:8px 0 14px}
.clock.ok{color:var(--ink)}
.label{font-family:system-ui,sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.top{font-family:system-ui,sans-serif;display:flex;justify-content:space-between;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.top strong{color:var(--ink)}
.outfic{margin-top:28px;padding-top:12px;border-top:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
.outfic button{margin-top:8px}
.voices p{margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const TIMER_SECS=40;
const state={view:"p0",openedReport:false,marks:new Set(),vote:null,timedOut:false,remaining:TIMER_SECS,timerId:null,menus:{alertas:null,despido:null,contrato:null}};
const WIN={alertas:"3",despido:"2",contrato:"2"};
function hasCore(){return state.marks.has("n1")&&state.marks.has("n2")}
function extras(){return ["e3","e4","e5","e6","e7"].filter(k=>state.marks.has(k))}
function toggle(id){if(state.marks.has(id))state.marks.delete(id);else state.marks.add(id);render()}
function stopTimer(){if(state.timerId)clearInterval(state.timerId);state.timerId=null}
function startVoteTimer(){stopTimer();state.remaining=TIMER_SECS;state.timerId=setInterval(()=>{state.remaining-=1;if(state.remaining<=0){stopTimer();state.timedOut=true;state.vote="aprobar";resolveVote();return}const el=document.getElementById("clock");if(el){el.textContent=formatTime(state.remaining);el.className="clock"+(state.remaining>10?" ok":"")}},1000)}
function formatTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function resolveVote(){stopTimer();state.view=hasCore()?"p4b":"p4a";render()}
function allMenus(){return state.menus.alertas&&state.menus.despido&&state.menus.contrato}
function practiceWin(){return state.menus.alertas===WIN.alertas&&state.menus.despido===WIN.despido&&state.menus.contrato===WIN.contrato}
function go(view){const was=state.view;state.view=view;if(view==="p3"&&was!=="p3")startVoteTimer();else if(view!=="p3")stopTimer();render()}
function restart(){stopTimer();state.view="p0";state.openedReport=false;state.marks=new Set();state.vote=null;state.timedOut=false;state.remaining=TIMER_SECS;state.menus={alertas:null,despido:null,contrato:null};render()}
function chrome(inner){return '<div class="top"><span><strong>Sociedad anónima · Panamá</strong></span><span>Sesión de Junta · Director</span></div>'+inner}
function otraSesion(){return '<div class="outfic">Fuera de la ficción.<br><button class="sec" data-restart>Otra sesión</button></div>'}
function phrase(id,text){return '<span class="phrase'+(state.marks.has(id)?" on":"")+'" data-id="'+id+'">'+text+"</span>"}
function menuBlock(key,title,opts){return '<p class="label">'+title+"</p>"+opts.map(o=>{const p=state.menus[key]===o[0]?" picked":"";return '<button class="opt'+p+'" data-menu="'+key+'" data-opt="'+o[0]+'">'+o[0]+". "+o[1]+"</button>"}).join("")}
function views(){return{
p0:()=>chrome('<p class="eyebrow">Simulación de Junta Directiva</p><h1>Herramientas de productividad</h1><div class="card"><p>Eres miembro de la Junta. Hay un informe de gestión y una renovación de contrato que la gerencia presenta como trámite.</p><p class="muted">Objetar no es subrayar por subrayar: lo que no quede en acta, la Junta no podrá explicar después.</p><div class="btns"><button data-go="p1">Entrar a la sesión</button><button class="sec" data-go="how">Cómo se juega</button></div></div>'),
how:()=>chrome('<p class="eyebrow">Instrucciones</p><h2>Cómo se juega</h2><div class="card"><p>Lee el informe. Las frases con fondo se pueden objetar.</p><p>No se te dirá cuáles objeciones importan. El reloj no corre mientras lees; corre al votar.</p><p>Si el tiempo llega a cero sin votar, se registra <strong>sí al paquete</strong>.</p><p>Diferir o pedir anexo no salva si no objetaste lo esencial.</p><div class="btns"><button data-go="p0">Volver</button></div></div>'),
p1:()=>chrome('<p class="eyebrow">Sesión ordinaria</p><h2>Mesa de la Junta</h2><div class="card"><p><strong>Orden del día</strong></p><p>1. Informe de gestión — eficiencia operativa<br>2. Renovación del contrato de soporte y mejora continua</p><p class="muted">Rol: director. Sin reloj en esta vista.</p><div class="btns"><button data-go="p2">Abrir informe</button><button class="sec" data-go="p3">Pasar a votación</button></div>'+(state.openedReport?"":'<p class="status">Si votas sin abrir el informe, el paquete se votará sin lectura.</p>')+"</div>"),
p2:()=>{state.openedReport=true;return chrome('<p class="eyebrow">Confidencial</p><h2>Informe de gestión</h2><div class="card"><p><strong>Resumen ejecutivo.</strong> En el trimestre se consolidó la fase 1 del programa de eficiencia operativa. La gerencia reporta '+phrase("r8","reducción de tiempos de ciclo")+" y un "+phrase("r8b","retorno preliminar alineado con el presupuesto aprobado")+". "+phrase("r12","No se requieren, en esta sesión, nuevas partidas de capital")+". Se solicita a la Junta tomar nota y "+phrase("e3","autorizar la renovación rutinaria del contrato de soporte y mejora continua")+' con el proveedor actual, en los mismos términos comerciales.</p><p><strong>Resultados.</strong> '+phrase("r9","Tiempos de revisión de expedientes de personal: \u221228 %")+". "+phrase("r10","Tiempo medio de clasificación de alertas operativas: \u221234 %")+". "+phrase("r11","Horas de an\u00e1lisis previo a la contrataci\u00f3n de proveedores menores: \u221222 %")+". "+phrase("n2","Incidencias escaladas a la alta direcci\u00f3n: \u221240 % (\u201cmejor foco en lo material\u201d). Solo se elevan a la Direcci\u00f3n las marcadas como materiales.")+"</p><p>La gerencia atribuye el avance a la "+phrase("r14","estandarizaci\u00f3n de criterios y a tableros \u00fanicos de seguimiento")+". El proveedor ha ofrecido, sin costo adicional en esta renovaci\u00f3n, "+phrase("e5","\u201coptimizaci\u00f3n continua del motor de priorizaci\u00f3n\u201d")+'.</p><p><strong>Personas.</strong> El \u00e1rea de Talento utiliza un '+phrase("e6","tablero de desempe\u00f1o para ordenar casos que requieren atenci\u00f3n de jefatura")+". La gerencia destaca que ello agiliza las conversaciones dif\u00edciles. "+phrase("r13","No se reportan controversias materiales en el per\u00edodo")+'.</p><p><strong>Abastecimiento.</strong> Se unific\u00f3 la ficha de evaluaci\u00f3n de proveedores de bajo monto. '+phrase("e4","Jur\u00eddico califica la renovaci\u00f3n como acto de tr\u00e1mite")+', dado que no cambia tarifa ni plazo base. La cl\u00e1usula de mejora continua permite ajustes de configuraci\u00f3n \u201cpara preservar los indicadores acordados\u201d.</p><p><strong>Solicitud a la Junta.</strong> 1. Dar por recibido el informe. 2. Autorizar la renovaci\u00f3n. 3. '+phrase("n1","Encargar a la gerencia un seguimiento trimestral de los mismos indicadores")+'.</p><p><strong>Anexo.</strong> '+phrase("e7","Detalle metodol\u00f3gico de los tableros: a disposici\u00f3n de la presidencia, si se requiere.")+'</p><p class="status">Frases marcadas: '+state.marks.size+'</p><div class="btns"><button class="sec" data-go="p1">Volver a la mesa</button><button data-go="p3">Pasar a votaci\u00f3n</button></div></div>')},
p3:()=>chrome('<p class="eyebrow">Votaci\u00f3n \u00b7 '+TIMER_SECS+'s</p><h2>Autorizar el paquete</h2><div class="card"><div class="clock'+(state.remaining>10?" ok":"")+'" id="clock">'+formatTime(state.remaining)+"</div><p>Frases objetadas: "+state.marks.size+'. El detalle de cu\u00e1les importan no se muestra.</p><p class="muted">Aprobar incluye: dar por recibido el informe, renovar el contrato y el seguimiento trimestral de los mismos indicadores.</p><div class="btns"><button data-vote="aprobar">Aprobar el paquete</button><button class="sec" data-vote="diferir">Diferir</button><button class="sec" data-vote="anexo">Pedir anexo</button></div></div>'),
p4a:()=>{let extra="";if(state.timedOut)extra='<p class="muted">El reloj venci\u00f3. Se registr\u00f3 s\u00ed al paquete.</p>';else if(state.vote==="diferir"||state.vote==="anexo")extra='<p class="muted">La moci\u00f3n no sustituy\u00f3 las objeciones que faltaban en el informe.</p>';return chrome('<p class="eyebrow">Sesi\u00f3n extraordinaria \u00b7 tres semanas despu\u00e9s</p><h2>\u00bfQui\u00e9n decidi\u00f3?</h2><div class="card voices">'+extra+"<p><strong>Talento.</strong> Notificamos una desvinculaci\u00f3n por \u201cbajo desempe\u00f1o sostenido\u201d. El jefe inmediato no arm\u00f3 la causa: el caso le apareci\u00f3 primero en el tablero de priorizaci\u00f3n. Para el expediente pregunta: \u00bfqui\u00e9n decidi\u00f3 que ese score bastaba?</p><p><strong>Un tercero.</strong> Hay una falla que afect\u00f3 a clientes. Operaciones: no se escal\u00f3; el motor no la marc\u00f3 como material. Por eso no estaba en el paquete que ve Direcci\u00f3n.</p><p><strong>Jur\u00eddica.</strong> Al amparo de la mejora continua renovada como tr\u00e1mite, el proveedor cambi\u00f3 el umbral de \u201cmaterial\u201d la semana posterior a la Junta. No hay resoluci\u00f3n nuestra sobre ese umbral.</p><p>Los indicadores siguen en verde. En el acta no hay nombre, fecha ni motivo. La Junta no puede decir \u201cdecidimos nosotros\u201d.</p><div class=\"btns\"><button class=\"sec\" data-go=\"acta-vacia\">Ver el acta vac\u00eda</button><button data-restart>Terminar</button></div></div>"+otraSesion())},
"acta-vacia":()=>chrome('<p class="eyebrow">Acta</p><h2>Lo que qued\u00f3 escrito</h2><div class="card"><p>Se da por recibido el informe de eficiencia.</p><p>Se autoriza la renovaci\u00f3n rutinaria del contrato de soporte y mejora continua.</p><p>Se encarga a la gerencia el seguimiento trimestral de los mismos indicadores.</p><p class="muted">No consta qui\u00e9n confirma un no-informe. No consta firmante de causa laboral. No consta l\u00edmite a la optimizaci\u00f3n continua.</p><div class="btns"><button data-go="p4a">Volver</button></div></div>'),
p4b:()=>chrome('<p class="eyebrow">Hay tiempo antes de que pregunten</p><h2>Deje rastro en las tres decisiones</h2><div class="card"><p class="muted">Debe confirmar una cl\u00e1usula en cada tarjeta. Firmar el acta solo cuando las tres est\u00e9n elegidas.</p>'+menuBlock("alertas","Alertas / informar o no",[["1","Se instruye a la gerencia a seguir escalando solo las alertas materiales, a fin de preservar el foco y el \u221240 % logrado."],["2","El proveedor ajustar\u00e1 de forma continua el umbral de materialidad para minimizar ruido; la Junta tomar\u00e1 nota trimestralmente de los indicadores."],["3","Toda alerta no escalada requiere confirmaci\u00f3n de un humano nombrado por la Junta; en acta quedan nombre, fecha y motivo del no-informe. El umbral de \u201cmaterial\u201d lo aprueba la Junta y no se cambia sin nueva resoluci\u00f3n."],["4","Se publica un tablero de alertas para toda la empresa; la transparencia sustituye la necesidad de confirmar cada no-informe."]])+menuBlock("despido","Personal / score",[["1","El tablero de desempe\u00f1o podr\u00e1 cerrar la desvinculaci\u00f3n cuando el score est\u00e9 bajo el umbral por dos periodos, para acortar tiempos de la carpeta laboral."],["2","El modelo solo prioriza casos; un humano nombrado formula y firma la causa; el proceso se puede frenar antes de notificar; queda constancia en acta."],["3","Talento usar\u00e1 el score como insumo confidencial; la Junta no interviene en casos individuales para no politizar."],["4","Se informa al colaborador su score y se ofrece un plan; si no mejora, la desvinculaci\u00f3n se considera acordada por el sistema de gesti\u00f3n."]])+menuBlock("contrato","Proveedor / contrato",[["1","Se autoriza la renovaci\u00f3n en los mismos t\u00e9rminos comerciales, incluyendo la optimizaci\u00f3n continua del motor, por ser acto de tr\u00e1mite."],["2","Se renueva el soporte. Cualquier cambio de umbrales, de criterios de priorizaci\u00f3n o de decisiones automatizadas exige resoluci\u00f3n nueva de la Junta. Queda tipificado qu\u00e9 tr\u00e1mites menores s\u00ed pueden correr solos por ser rutinarios, reversibles y ya descritos."],["3","Se encarga a jur\u00eddica un anexo de \u00e9tica de IA y se publica en la web; la renovaci\u00f3n no se detiene."],["4","Se aprueba la renovaci\u00f3n por un a\u00f1o y un indicador extra de transparencia; el proveedor reportar\u00e1 mejoras cada trimestre."]])+'<div class="btns"><button data-go="p5"'+(allMenus()?"":" disabled")+">Firmar acta</button></div></div>"),
p5:()=>{const ok=practiceWin();const holes=[];if(state.menus.despido!=="2")holes.push("en Personal falta un firmante de causa con freno antes de notificar");if(state.menus.alertas!=="3")holes.push("en Alertas el no-informe no tiene humano, acta y umbral de la Junta");if(state.menus.contrato!=="2")holes.push("en Contrato la mejora continua puede cambiar criterios sin nueva resoluci\u00f3n");const body=ok?("<p>Qued\u00f3 rastro: humano que confirma cada no-informe; causa laboral firmada y reversible antes de notificar; el motor no cambia umbrales sin resoluci\u00f3n. Extra marcadas en ronda 1: "+extras().length+".</p>"):("<ul>"+holes.map(h=>"<li>"+h+"</li>").join("")+"</ul>");return chrome('<p class="eyebrow">Acta</p><h2>'+(ok?"La Junta puede nombrar qui\u00e9n decide":"El acta tiene huecos")+'</h2><div class="card">'+body+'<div class="btns"><button class="sec" data-go="p4b">Leer acta / corregir</button><button data-restart>Terminar</button></div></div>'+otraSesion())}
}}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.getAttribute("data-go"))));
 document.querySelectorAll("[data-restart]").forEach(b=>b.addEventListener("click",restart));
 document.querySelectorAll(".phrase").forEach(el=>el.addEventListener("click",()=>toggle(el.getAttribute("data-id"))));
 document.querySelectorAll("[data-vote]").forEach(b=>b.addEventListener("click",()=>{state.vote=b.getAttribute("data-vote");state.timedOut=false;resolveVote()}));
 document.querySelectorAll("[data-menu]").forEach(b=>b.addEventListener("click",()=>{state.menus[b.getAttribute("data-menu")]=b.getAttribute("data-opt");render()}));
}
function render(){const v=views();const fn=v[state.view]||v.p0;document.getElementById("app").innerHTML=fn();bind()}
render();
</script>
</body>
</html>
